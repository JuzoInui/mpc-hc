name: Build MPC-HC Tablet x64

on:
  workflow_dispatch:
  push:
    branches:
      - tablet-frame

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install assembler tools
        shell: powershell
        run: choco install nasm yasm --yes --no-progress

      - name: Configure native build tools
        shell: powershell
        run: |
          & C:\msys64\usr\bin\bash.exe -lc "pacman -S --needed --noconfirm make diffutils pkgconf mingw-w64-x86_64-gcc mingw-w64-x86_64-bzip2"

          # The bundled LAV/FFmpeg scripts expect GNU binutils with a cross-tool
          # prefix, while current MSYS2 also exposes several of them unprefixed.
          $binutils = @("ar", "nm", "objcopy", "objdump", "ranlib", "strip", "windres", "dlltool", "as", "ld")
          foreach ($tool in $binutils) {
            $source = "C:\msys64\mingw64\bin\$tool.exe"
            $target = "C:\msys64\mingw64\bin\x86_64-w64-mingw32-$tool.exe"
            if ((Test-Path $source) -and -not (Test-Path $target)) {
              Copy-Item $source $target
            }
          }

          $mingwCompat = "C:\msys64\mingw64\x86_64-w64-mingw32\lib"
          New-Item -ItemType Directory -Force $mingwCompat | Out-Null
          Copy-Item "C:\msys64\mingw64\lib\libmingwex.a" $mingwCompat -Force

          $gccVersion = (& C:\msys64\mingw64\bin\gcc.exe -dumpversion).Trim()
          $gcc64 = "C:\msys64\mingw64\lib\gcc\x86_64-w64-mingw32\$gccVersion\libgcc.a"
          $gcc32Compat = "C:\msys64\mingw64\lib\gcc\i686-w64-mingw32\$gccVersion"
          $mingw32Compat = "C:\msys64\mingw64\i686-w64-mingw32\lib"
          New-Item -ItemType Directory -Force $gcc32Compat | Out-Null
          New-Item -ItemType Directory -Force $mingw32Compat | Out-Null
          Copy-Item $gcc64 $gcc32Compat -Force
          Copy-Item "C:\msys64\mingw64\lib\libmingwex.a" $mingw32Compat -Force

          $nasm = Get-Item "$env:ProgramFiles\NASM\nasm.exe" -ErrorAction SilentlyContinue
          $yasm = Get-Item "$env:ChocolateyInstall\lib\yasm\tools\yasm.exe" -ErrorAction SilentlyContinue
          $libTool = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" -Filter lib.exe -Recurse |
            Where-Object FullName -Match 'Hostx64\\x64\\lib\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $nasm -or -not $yasm -or -not $libTool) {
            throw "NASM, YASM, or the Visual C++ librarian was not found."
          }

          $nasm.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $yasm.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $libTool.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MPCHC_MSYS=C:\msys64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MPCHC_MINGW64=C:\msys64\mingw64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSYS2_PATH_TYPE=inherit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare MinGW support libraries
        shell: cmd
        run: call update_mingwlib.bat

      - name: Select installed Windows 10 SDK
        shell: powershell
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Where-Object Name -Match '^\d+\.\d+\.\d+\.\d+$' |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $sdk) {
            throw "No Windows 10 SDK was found on the runner."
          }
          "MPCHC_WINSDK_VER=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Windows SDK $sdk"

      - name: Prepare legacy full-build dependencies
        shell: powershell
        run: |
          $lavRoot = "src\thirdparty\LAVFilters\src"
          $lavBase = (& git -C $lavRoot rev-list --max-parents=0 HEAD | Select-Object -First 1).Trim()
          if (-not $lavBase) {
            throw "Unable to determine the LAVFilters history root."
          }
          & git -C $lavRoot tag --force tablet-build-base $lavBase

          & msbuild src\thirdparty\freetype2\freetype2.vcxproj /nologo /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:MPCHC_WINSDK_VER=$env:MPCHC_WINSDK_VER
          if ($LASTEXITCODE -ne 0) {
            throw "FreeType prerequisite build failed."
          }

      - name: Build x64 release
        shell: cmd
        run: |
          call update_version.bat
          msbuild mpc-hc.sln /nologo /m /t:Build /p:Configuration="Release" /p:Platform=x64 /p:MPCHC_WINSDK_VER=%MPCHC_WINSDK_VER% /p:SkipMingwLibUpdate=true

      - name: Collect portable player
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact
          Copy-Item "bin\mpc-hc_x64\*" artifact\ -Recurse -Force
          Copy-Item TABLET_BUILD.md artifact\

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: mpc-hc-tablet-full-win10-x64
          path: artifact
          if-no-files-found: error
